default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      # Keep background imports and notifications from competing with the two
      # interactive Puma threads on the production host. JOB_CONCURRENCY is
      # already one process; one worker thread makes that limit real instead
      # of running three database-heavy jobs concurrently.
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
